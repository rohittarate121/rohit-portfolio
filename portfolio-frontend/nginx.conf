server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — if there's no real file at this path, hand it to
    # index.html so React Router can take over client-side. Without this,
    # any route besides "/" 404s on a direct visit or a page refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints built asset filenames (e.g. index-a1b2c3.js), so a
    # new deploy naturally gets new filenames — safe to cache aggressively,
    # there's no risk of ever serving a stale cached script.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}