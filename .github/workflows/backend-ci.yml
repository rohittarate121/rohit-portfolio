name: Backend CI

on:
  push:
    branches: [main]
    # paths:
    #   - "portfolio-backend/**"
  pull_request:
    branches: [main]
    # paths:
    #   - "portfolio-backend/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rohit123
          MYSQL_DATABASE: portfolio_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and run tests
        working-directory: ./portfolio-backend
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: mvn -B test
