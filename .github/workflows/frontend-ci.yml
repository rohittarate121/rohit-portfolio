name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "portfolio-frontend/**"
  pull_request:
    branches: [main]
    paths:
      - "portfolio-frontend/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ./portfolio-frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./portfolio-frontend
        run: npm ci

      - name: Build
        working-directory: ./portfolio-frontend
        env:
          VITE_API_BASE_URL: http://localhost:8080/api
        run: npm run build

  package:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set lowercase image owner
        run: echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./portfolio-frontend
          push: true
          # Still localhost — see this step's notes. Phase 16 revisits
          # this once a real backend URL exists.
          build-args: |
            VITE_API_BASE_URL=http://localhost:8080/api
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/portfolio-frontend:latest
