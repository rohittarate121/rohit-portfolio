spring.application.name=portfolio-backend

# Local dev defaults only — never used in production (see Phase 16).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/portfolio_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Run data.sql against MySQL (not just embedded DBs), and only after
# Hibernate creates the tables from the entities above.
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

server.port=8080

# CORS — which frontend origin(s) may call this API. Comma-separated for multiple.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Seeded once, only if the users table is empty. Override via env vars
# for your real credentials — never edit the default value in this file.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:ChangeMe123!}

# No default value here on purpose — see the note below for generating
# your own and setting it as a real environment variable.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Actuator — health check only, for Docker/orchestration to poll.
# Deliberately narrow: not a general admin/metrics surface.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never